# Isolated lab stack: own project name, own :lab images, own volume,
# only published port is 127.0.0.1:8443 -- never touches the live "basic"
# stack. Reach it over the tailnet with:
#   tailscale serve --bg --https=8443 https+insecure://127.0.0.1:8443
name: excalidraw-lab

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:8443:443
    volumes:
      - ../basic/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [frontend, storage, room]

  frontend:
    image: excalidraw-frontend:lab
    restart: unless-stopped

  storage:
    image: excalidraw-storage-backend:lab
    restart: unless-stopped
    environment:
      - PORT=8081
      - STORAGE_URI=sqlite://data/storage.sqlite
    volumes:
      - lab-storage-data:/app/data

  room:
    image: excalidraw-room-go:lab
    restart: unless-stopped
    environment:
      - PORT=80

volumes:
  lab-storage-data:
